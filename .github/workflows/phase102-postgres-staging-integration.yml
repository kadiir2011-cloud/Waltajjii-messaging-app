name: Phase 102 PostgreSQL staging integration
on:
  pull_request:
    paths:
      - "src/postgres/**"
      - "src/services/postgres-realtime-service.js"
      - "src/db/postgres-adapter.js"
      - "migrations/postgres/**"
      - "test/phase55-postgres-realtime-integration.test.js"
      - "test/phase102-postgres-staging-integration.test.js"
      - ".github/workflows/phase102-postgres-staging-integration.yml"
  push:
    branches:
      - waltajjii-phase102-postgres-staging-integration
permissions:
  contents: read
jobs:
  postgres-staging-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waltajjii_staging
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d waltajjii_staging"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/waltajjii_staging
      ALLOW_DISPOSABLE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install Socket.IO client for isolated integration test
        run: npm install --no-save --package-lock=false socket.io-client@4.8.1
      - name: Verify disposable database safety guard
        run: node --test test/phase102-postgres-staging-integration.test.js
      - name: Run real PostgreSQL and Socket.IO integration
        run: node --test test/phase55-postgres-realtime-integration.test.js
