name: Phase 44 PostgreSQL realtime Socket.IO tests

on:
  pull_request:
    paths:
      - "src/postgres/postgres-realtime-socket.js"
      - "src/services/postgres-realtime-service.js"
      - "test/phase44-postgres-realtime-socket.test.js"
      - ".github/workflows/phase44-postgres-realtime-socket.yml"

permissions:
  contents: read

jobs:
  realtime-socket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Test isolated PostgreSQL Socket.IO integration
        run: node --test test/phase44-postgres-realtime-socket.test.js
