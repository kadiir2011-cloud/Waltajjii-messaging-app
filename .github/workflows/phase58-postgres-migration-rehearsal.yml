name: Phase 58 disposable PostgreSQL migration rehearsal
on:
  pull_request:
    paths:
      - "scripts/phase58-postgres-migration-rehearsal.js"
      - "test/phase58-postgres-migration-rehearsal.test.js"
      - "migrations/postgres/**"
      - "src/db.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/phase58-postgres-migration-rehearsal.yml"
permissions:
  contents: read
jobs:
  full-migration-rehearsal:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waltajjii_phase58_rehearsal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d waltajjii_phase58_rehearsal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waltajjii_phase58_rehearsal
      WALTAJJII_ALLOW_DISPOSABLE_TARGET: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run full SQLite to PostgreSQL rehearsal
        run: node --test test/phase58-postgres-migration-rehearsal.test.js
