name: Phase 106 shared PostgreSQL direct-call state
on:
  pull_request:
    paths:
      - "src/postgres/postgres-realtime-socket.js"
      - "src/services/postgres-call-state-service.js"
      - "migrations/postgres/008_realtime_direct_call_state.sql"
      - "test/phase55-postgres-realtime-integration.test.js"
      - "test/phase101-postgres-realtime-parity.test.js"
      - "test/phase44-postgres-realtime-socket.test.js"
      - "test/phase88-end-to-end-security-verification.test.js"
      - "test/phase89-performance-scalability.test.js"
      - "PHASE-106-SHARED-POSTGRES-DIRECT-CALL-STATE.md"
      - ".github/workflows/phase106-shared-postgres-direct-call-state.yml"
  push:
    branches:
      - waltajjii-phase106-postgres-shared-direct-call-state
permissions:
  contents: read
jobs:
  shared-direct-call-state:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waltajjii_phase106_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d waltajjii_phase106_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waltajjii_phase106_test
      ALLOW_DISPOSABLE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install test-only realtime clients
        run: npm install --no-save --package-lock=false socket.io-client@4.8.1 @socket.io/postgres-adapter@0.5.0
      - name: Verify PostgreSQL call-state and realtime unit suites
        run: node --test test/phase104-postgres-call-state.test.js test/phase101-postgres-realtime-parity.test.js test/phase44-postgres-realtime-socket.test.js test/phase88-end-to-end-security-verification.test.js test/phase89-performance-scalability.test.js
      - name: Verify direct calls across two independent PostgreSQL runtimes
        run: node --test test/phase55-postgres-realtime-integration.test.js
