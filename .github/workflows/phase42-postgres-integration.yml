name: Phase 42 disposable PostgreSQL integration

on:
  pull_request:
    paths:
      - "migrations/postgres/001_initial_schema.sql"
      - "test/phase42-postgres-integration.test.js"
      - ".github/workflows/phase42-postgres-integration.yml"
      - "PHASE-42-DISPOSABLE-POSTGRES-INTEGRATION.md"

permissions:
  contents: read

jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waltajjii_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d waltajjii_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waltajjii_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies without native build scripts
        run: npm ci --ignore-scripts
      - name: Execute draft schema and verify PostgreSQL catalogs and behavior
        run: node --test test/phase42-postgres-integration.test.js
