name: Phase 73 group call signaling
on:
  pull_request:
    paths:
      - "src/server.js"
      - "test/phase73-group-call-signaling.test.js"
      - "PHASE-73-GROUP-CALL-SIGNALING.md"
      - ".github/workflows/phase73-group-call-signaling.yml"
permissions:
  contents: read
jobs:
  group-call-signaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check server JavaScript syntax
        run: node --check src/server.js
      - name: Run group call and one-to-one call regression tests
        run: node --test test/phase73-group-call-signaling.test.js test/phase72-secure-call-screen-sharing.test.js test/phase71-smart-network-adaptation.test.js test/phase70-call-recovery.test.js test/phase69-call-quality-monitor.test.js test/phase68-live-call-interpreter.test.js test/phase67-live-call-captions.test.js test/phase44-postgres-realtime-socket.test.js
