name: Phase 78 regression hardening
on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "test/**"
      - ".github/workflows/phase78-regression-hardening.yml"
      - "PHASE-78-REGRESSION-HARDENING.md"
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check server and browser JavaScript syntax
        run: |
          node --check src/server.js
          node --check public/app.js
          find src public test -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run the complete Node test suite
        run: node --test test/*.test.js
