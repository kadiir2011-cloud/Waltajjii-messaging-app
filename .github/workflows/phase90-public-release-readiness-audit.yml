name: Phase 90 public release readiness audit
on:
  pull_request:
    paths:
      - "src/db.js"
      - "src/server.js"
      - "src/storage.js"
      - "src/routes/uploads.js"
      - "src/routes/moments.js"
      - "src/security/auth-rate-limiters.js"
      - "src/security/redis-rest-rate-limit-store.js"
      - "src/security/session-token-policy.js"
      - "src/security/account-recovery-tokens.js"
      - "scripts/phase90-public-release-readiness-audit.js"
      - "test/phase90-public-release-readiness-audit.test.js"
      - ".github/workflows/phase90-public-release-readiness-audit.yml"
      - "PHASE-90-PUBLIC-RELEASE-READINESS-ASSESSMENT.md"
permissions:
  contents: read
jobs:
  release-readiness-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static readiness audit
        run: |
          node --check scripts/phase90-public-release-readiness-audit.js
          node --check test/phase90-public-release-readiness-audit.test.js
          node scripts/phase90-public-release-readiness-audit.js > phase90-report.json || test "$?" -eq 2
          node --test test/phase90-public-release-readiness-audit.test.js
