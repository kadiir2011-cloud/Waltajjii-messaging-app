name: Phase 101 PostgreSQL realtime parity
on:
  pull_request:
    paths:
      - "src/postgres/postgres-realtime-socket.js"
      - "src/services/postgres-realtime-service.js"
      - "test/phase101-postgres-realtime-parity.test.js"
      - "test/phase100-postgres-sqlite-compatibility-audit.test.js"
      - "PHASE-101-POSTGRES-REALTIME-PARITY.md"
      - ".github/workflows/phase101-postgres-realtime-parity.yml"
  push:
    branches:
      - waltajjii-phase101-postgres-realtime-parity
permissions:
  contents: read
jobs:
  phase101-realtime-parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify realtime parity and prior release gates
        run: node --test test/phase101-postgres-realtime-parity.test.js test/phase100-postgres-sqlite-compatibility-audit.test.js test/phase99-postgres-staging-bootstrap.test.js test/phase98-postgres-service-composition.test.js test/phase97-postgres-runtime-migration-map.test.js test/phase96-staging-integration-safety.test.js test/phase44-postgres-realtime-socket.test.js test/phase67-live-call-captions.test.js test/phase68-live-call-interpreter.test.js test/phase69-call-quality-monitor.test.js test/phase70-call-recovery.test.js test/phase73-group-call-signaling.test.js test/phase75-group-call-controls.test.js test/phase88-end-to-end-security-verification.test.js test/postgres-realtime-service.test.js
