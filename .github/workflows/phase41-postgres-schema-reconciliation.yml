name: Phase 41 PostgreSQL schema reconciliation checks

on:
  pull_request:
    paths:
      - "src/db.js"
      - "migrations/postgres/001_initial_schema.sql"
      - "PHASE-41-POSTGRESQL-SCHEMA-RECONCILIATION.md"
      - "test/phase41-postgres-schema-reconciliation.test.js"
      - ".github/workflows/phase41-postgres-schema-reconciliation.yml"

permissions:
  contents: read

jobs:
  schema-reconciliation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify SQLite and PostgreSQL schema contracts
        run: node --test test/phase41-postgres-schema-reconciliation.test.js
