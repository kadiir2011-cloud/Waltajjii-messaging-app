name: Phase 56 API and frontend contract regression
on:
  pull_request:
    paths:
      - "public/app.js"
      - "src/server.js"
      - "src/routes/postgres-*.js"
      - "test/phase56-api-frontend-contract.test.js"
      - "PHASE-56-API-FRONTEND-COMPATIBILITY.md"
      - ".github/workflows/phase56-api-frontend-regression.yml"
permissions:
  contents: read
jobs:
  api-frontend-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Phase 56 source contract regression tests
        run: node --test test/phase56-api-frontend-contract.test.js
