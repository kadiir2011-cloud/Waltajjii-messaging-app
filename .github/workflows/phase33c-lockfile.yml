name: Phase 33C regenerate dependency lockfile

on:
  push:
    branches:
      - waltajjii-postgres-adapter-phase33c
    paths:
      - "package.json"

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Phase 33C branch
        uses: actions/checkout@v4
        with:
          ref: waltajjii-postgres-adapter-phase33c
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate complete npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Phase 33C: regenerate npm lockfile with pg"
          git push origin HEAD:waltajjii-postgres-adapter-phase33c
