name: Phase 43 PostgreSQL auth and profile integration

on:
  pull_request:
    paths:
      - "src/db/postgres-adapter.js"
      - "src/services/postgres-auth-service.js"
      - "src/routes/postgres-auth.js"
      - "migrations/postgres/001_initial_schema.sql"
      - "test/phase43-postgres-auth-profile-integration.test.js"
      - ".github/workflows/phase43-postgres-auth-profile.yml"

permissions:
  contents: read

jobs:
  postgres-auth-profile:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: waltajjii_phase43_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d waltajjii_phase43_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/waltajjii_phase43_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Exercise PostgreSQL auth and profile endpoints
        run: node --test test/phase43-postgres-auth-profile-integration.test.js
