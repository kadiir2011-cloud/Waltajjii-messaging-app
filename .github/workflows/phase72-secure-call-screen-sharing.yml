name: Phase 72 secure call screen sharing
on:
  pull_request:
    paths:
      - "public/app.js"
      - "public/index.html"
      - "test/phase72-secure-call-screen-sharing.test.js"
      - "PHASE-72-SECURE-CALL-SCREEN-SHARING.md"
      - ".github/workflows/phase72-secure-call-screen-sharing.yml"
permissions:
  contents: read
jobs:
  secure-call-screen-sharing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check src/server.js
      - name: Run screen sharing and call regression tests
        run: node --test test/phase72-secure-call-screen-sharing.test.js test/phase71-smart-network-adaptation.test.js test/phase70-call-recovery.test.js test/phase69-call-quality-monitor.test.js test/phase68-live-call-interpreter.test.js test/phase67-live-call-captions.test.js test/phase44-postgres-realtime-socket.test.js
