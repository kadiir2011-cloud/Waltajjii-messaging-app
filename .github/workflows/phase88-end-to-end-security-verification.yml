name: Phase 88 end-to-end security verification
on:
  pull_request:
    paths:
      - "src/server.js"
      - "src/routes/postgres-auth.js"
      - "src/postgres/postgres-realtime-socket.js"
      - "src/security/session-token-policy.js"
      - "src/security/origin-policy.js"
      - "test/phase88-end-to-end-security-verification.test.js"
      - ".github/workflows/phase88-end-to-end-security-verification.yml"
      - "PHASE-88-END-TO-END-SECURITY-VERIFICATION.md"
permissions:
  contents: read
jobs:
  end-to-end-security-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Check syntax
        run: node --check test/phase88-end-to-end-security-verification.test.js
      - name: Run cross-layer security verification
        run: |
          node --test test/phase88-end-to-end-security-verification.test.js
          node --test test/phase44-postgres-realtime-socket.test.js
          node --test test/phase63-final-security-audit.test.js
