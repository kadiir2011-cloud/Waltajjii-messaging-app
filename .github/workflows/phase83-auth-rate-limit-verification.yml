name: Phase 83 authentication rate-limit verification
on:
  pull_request:
    paths:
      - "src/security/auth-rate-limiters.js"
      - "test/phase83-auth-rate-limit-verification.test.js"
      - ".github/workflows/phase83-auth-rate-limit-verification.yml"
      - "PHASE-83-AUTH-RATE-LIMIT-VERIFICATION.md"
permissions:
  contents: read
jobs:
  auth-rate-limit-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check syntax
        run: |
          node --check src/security/auth-rate-limiters.js
          node --check test/phase83-auth-rate-limit-verification.test.js
      - name: Run rate-limit verification tests
        run: node --test test/phase83-auth-rate-limit-verification.test.js
